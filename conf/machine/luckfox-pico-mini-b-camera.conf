# Luckfox Pico Mini B with SC3336 MIPI camera (RV1103G)
# This variant boots from SD card and enables the MIPI CSI camera path.

require conf/machine/include/rv1103.inc
require conf/machine/include/rockchip-wic.inc

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

KERNEL_DEVICETREE = "rockchip/rv1103g-luckfox-pico-mini-b-camera.dtb"

UBOOT_CONFIG ??= "sdcard"
UBOOT_CONFIG[sdcard] = "luckfox-pico-mini-b-rv1103g_defconfig"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "resize-rootfs usb-gadget-serial"

# Camera stack: sensor, CSI2 DPHY, MIPI CSI2 receiver and the vendor CIF
# capture device that drives them.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-sc3336"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-phy-rockchip-csi2-dphy"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-phy-rockchip-csi2-dphy-hw"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-rockchip-cif-vendor"

MACHINE_FEATURES += "usbhost usbgadget"

# Bring-up helpers so the camera buses can be inspected on the target.
IMAGE_INSTALL:append = " i2c-tools v4l-utils"
