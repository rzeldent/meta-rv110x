# Luckfox Pico Mini B (RV1103G)
# Base machine configuration - features controlled via LUCKFOX_FEATURES
# Default features: camera aic8800dc npu vcodec
# Add "nand" for SPI NAND boot, "nand-mtd" for NAND exposed as MTD (SD card boot)

require conf/machine/include/rv1103.inc
require conf/machine/include/luckfox-common.inc

KERNEL_DEVICETREE = "rockchip/rv1103g-luckfox-pico-mini-b.dtb"

UBOOT_CONFIG ??= "sdcard"
UBOOT_CONFIG[sdcard] = "luckfox-pico-mini-b-rv1103g_defconfig"
UBOOT_CONFIG[nand] = "luckfox-pico-mini-b-rv1103g_defconfig"
