# Luckfox Pico Plus - SD card boot (RV1106)
# This variant uses SD card for boot and rootfs

require conf/machine/include/rv1103.inc
require conf/machine/include/rockchip-wic.inc

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

KERNEL_DEVICETREE = "rockchip/rv1106-luckfox-pico-plus.dtb"

UBOOT_CONFIG ??= "sdcard"
UBOOT_CONFIG[sdcard] = "luckfox-pico-plus-rv1106_defconfig"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "resize-rootfs"

MACHINE_FEATURES += "usbhost usbgadget"
